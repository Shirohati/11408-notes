name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build web408
        working-directory: web408
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          cp index.html site/index.html
          cp -r vocab-app site/vocab-app
          cp -r web408/dist site/web408

      - uses: actions/configure-pages@v5
        with:
          static_site_generator: mkdocs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
