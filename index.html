<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="11408 考研复习工具箱：背诵笔记、408 刷题、词汇学习一站直达" />
    <title>考研工具箱 · 11408</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: rgba(255, 255, 255, 0.06);
        --card-border: rgba(255, 255, 255, 0.12);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #818cf8;
        --accent-2: #38bdf8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
      }
      .bg-glow {
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(600px 400px at 15% 10%, rgba(129, 140, 248, 0.18), transparent 65%),
          radial-gradient(700px 500px at 85% 25%, rgba(56, 189, 248, 0.12), transparent 65%),
          radial-gradient(800px 600px at 50% 100%, rgba(167, 139, 250, 0.10), transparent 70%);
      }
      .hero {
        text-align: center;
        padding: 88px 24px 24px;
      }
      .hero .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        letter-spacing: 3px;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 22px;
      }
      .hero .logo::before,
      .hero .logo::after {
        content: "";
        width: 36px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(148, 163, 184, 0.6));
      }
      .hero .logo::after {
        background: linear-gradient(90deg, rgba(148, 163, 184, 0.6), transparent);
      }
      .hero h1 {
        font-size: clamp(34px, 6vw, 52px);
        font-weight: 800;
        letter-spacing: 2px;
        background: linear-gradient(120deg, #fff 30%, #a5b4fc 60%, #67e8f9 90%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .hero p {
        margin-top: 14px;
        font-size: 15px;
        color: var(--muted);
      }
      .cards {
        max-width: 1020px;
        margin: 56px auto 0;
        padding: 0 20px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
      }
      .card {
        position: relative;
        display: block;
        text-decoration: none;
        color: inherit;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 18px;
        padding: 30px 26px 26px;
        backdrop-filter: blur(14px);
        transition: transform 0.25s ease, border-color 0.25s ease,
          box-shadow 0.25s ease, background 0.25s ease;
        animation: rise 0.6s ease both;
      }
      .card:nth-child(1) { animation-delay: 0.05s; }
      .card:nth-child(2) { animation-delay: 0.15s; }
      .card:nth-child(3) { animation-delay: 0.25s; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(22px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .card:hover {
        transform: translateY(-6px);
        border-color: rgba(129, 140, 248, 0.55);
        background: rgba(255, 255, 255, 0.09);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(129, 140, 248, 0.2);
      }
      .card .icon {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        background: linear-gradient(135deg, rgba(129, 140, 248, 0.22), rgba(56, 189, 248, 0.18));
        border: 1px solid rgba(129, 140, 248, 0.35);
      }
      .card .icon svg { width: 24px; height: 24px; }
      .card h2 {
        font-size: 19px;
        font-weight: 700;
        margin-bottom: 10px;
        letter-spacing: 0.5px;
      }
      .card p {
        font-size: 13.5px;
        line-height: 1.75;
        color: var(--muted);
      }
      .card .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 22px;
      }
      .card .tag {
        font-size: 12px;
        color: #c7d2fe;
        background: rgba(129, 140, 248, 0.15);
        border: 1px solid rgba(129, 140, 248, 0.3);
        border-radius: 20px;
        padding: 4px 12px;
      }
      .card .arrow {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        transition: transform 0.25s ease, background 0.25s ease;
      }
      .card:hover .arrow {
        transform: translateX(4px) rotate(-45deg);
        background: var(--accent);
        border-color: var(--accent);
      }
      .card .arrow svg { width: 14px; height: 14px; }
      .notice {
        max-width: 1020px;
        margin: 40px auto 0;
        padding: 0 20px;
        text-align: center;
        font-size: 12.5px;
        color: rgba(148, 163, 184, 0.7);
      }
      footer {
        text-align: center;
        padding: 40px 20px 32px;
        font-size: 12px;
        color: rgba(148, 163, 184, 0.6);
      }
      @media (max-width: 640px) {
        .hero { padding-top: 64px; }
        .cards { margin-top: 40px; }
      }
    </style>
  </head>
  <body>
    <div class="bg-glow"></div>

    <header class="hero">
      <div class="logo">Kaoyan Toolbox</div>
      <h1>考研工具箱</h1>
      <p>11408 考研复习 · 笔记 · 刷题 · 词汇，一站直达</p>
    </header>

    <main class="cards">
      <a class="card" href="./考研11408笔记/" target="_blank" rel="noopener">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            <path d="M9 7h7M9 11h7M9 15h4" />
          </svg>
        </div>
        <h2>考研背诵笔记</h2>
        <p>政治、英语一、数学一、408 四科核心背诵知识点，反复背诵、便携查阅、全文搜索。</p>
        <div class="footer">
          <span class="tag">笔记文档</span>
          <span class="arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 17L17 7M8 7h9v9" />
            </svg>
          </span>
        </div>
      </a>

      <a class="card" href="./web408/" target="_blank" rel="noopener">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6l-5 6 5 6M16 6l5 6-5 6M13.5 4l-3 16" />
          </svg>
        </div>
        <h2>408 刷题助手</h2>
        <p>数据结构、计组、操作系统、计算机网络四科题库，刷题、错题本、收藏、统计、闪卡。</p>
        <div class="footer">
          <span class="tag">题库应用</span>
          <span class="arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 17L17 7M8 7h9v9" />
            </svg>
          </span>
        </div>
      </a>

      <a class="card" href="./vocab-app/" target="_blank" rel="noopener">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
          </svg>
        </div>
        <h2>考研词汇学习</h2>
        <p>纯前端单词记忆工具，隐藏翻译、认识标记、生词计数，数据本地保存、支持备份。</p>
        <div class="footer">
          <span class="tag">词汇应用</span>
          <span class="arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 17L17 7M8 7h9v9" />
            </svg>
          </span>
        </div>
      </a>
    </main>

    <div class="notice">数据与学习进度均保存在浏览器本地，请定期导出备份</div>

    <footer>Kaoyan Toolbox · 11408</footer>
  </body>
</html>
